<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成立交桥 | 造形家</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
    :root { color-scheme: dark; --canvas: #0e1414; --white: #fff; --subtle: rgba(255,255,255,.4); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--canvas); color: var(--white); font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
    .bridge-section { width: 100%; min-height: 552px; display: flex; justify-content: center; align-items: center; border-top: 1px solid rgba(0,177,204,.1); border-bottom: 1px solid rgba(0,177,204,.1); overflow: hidden; }
    .bridge-inner { width: min(100%, 1440px); padding: 96px 80px; display: flex; align-items: center; gap: 48px; }
    .bridge-copy { flex: 1 1 0; max-width: 512px; padding-bottom: 32px; }
    .bridge-title { margin: 0 0 8px; font-size: 40px; line-height: 56px; font-weight: 700; letter-spacing: 0; }
    .bridge-description { margin: 0; color: var(--subtle); font-size: 20px; line-height: 28px; font-weight: 400; }
    .bridge-media-wrap { flex: 0 0 auto; padding-left: 64px; display: flex; align-items: center; }
    .bridge-media { width: 640px; height: 360px; overflow: hidden; border-radius: 4px; background: #474747; }
    .bridge-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 1100px) {
      .bridge-inner { padding: 72px 48px; }
      .bridge-media-wrap { padding-left: 20px; }
      .bridge-media { width: min(52vw, 640px); height: min(29.25vw, 360px); }
      .bridge-title { font-size: 34px; line-height: 46px; }
      .bridge-description { font-size: 17px; line-height: 25px; }
    }
    @media (max-width: 720px) {
      .bridge-section { min-height: 100vh; }
      .bridge-inner { padding: 64px 24px; flex-direction: column; align-items: stretch; gap: 32px; }
      .bridge-copy { max-width: none; padding-bottom: 0; }
      .bridge-title { font-size: 32px; line-height: 44px; }
      .bridge-description { font-size: 16px; line-height: 26px; }
      .bridge-media-wrap { padding-left: 0; }
      .bridge-media { width: 100%; height: auto; aspect-ratio: 16 / 9; }
    }
  </style>
</head>
<body>
  <main class="bridge-section" aria-labelledby="bridge-title">
    <div class="bridge-inner">
      <div class="bridge-copy">
        <h1 class="bridge-title" id="bridge-title">生成立交桥</h1>
        <p class="bridge-description">通过AI算法精准识别立交桥结构、桥墩立柱、道路关系及周边环境，快速生成高精度三维立交桥模型</p>
      </div>
      <div class="bridge-media-wrap">
        <figure class="bridge-media">
          <img src="assets/city-aerial.jpg" alt="城市立交桥三维场景">
        </figure>
      </div>
    </div>
  </main>
</body>
</html>
